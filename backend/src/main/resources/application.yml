spring:
  application:
    name: yingxiang-migration
  profiles:
    default: local
  main:
    banner-mode: 'off'
  servlet:
    multipart:
      # 迁移入口按有界内存自行解析multipart，禁止Servlet容器预解析或落盘。
      enabled: false
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
  sql:
    init:
      mode: never
  flyway:
    enabled: false
server:
  address: 127.0.0.1
  port: ${MIGRATION_API_PORT:8792}
  servlet:
    context-path: /api
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    accesslog:
      enabled: false
logging:
  level:
    root: WARN
migration:
  studio-fixture-enabled: false
  studio-fixture-url: "http://127.0.0.1:12114/v1/client/tokens"
  auth-enabled: false
  account-read-enabled: false
  payments-enabled: false
  admin-enabled: false
  stripe-secret: ""
  stripe-webhook-secret: ""
  stripe-expected-account: ""
  stripe-api-base: "http://127.0.0.1:12111"
  video-enabled: false
  video-budget-usd: "0"
  video-max-jobs: "0"
  video-allowed-usernames: ""
  video-provider-url: "http://127.0.0.1:12112"
  video-key: ""
  works-enabled: false
  storage-root: "C:/yingxiang-migration-storage"
  prompt-enabled: false
  prompt-budget-usd: "0"
  prompt-max-sessions: "0"
  prompt-allowed-usernames: ""
  prompt-unlimited-usernames: ""
  prompt-key: ""
  prompt-token-url: "http://127.0.0.1:12113/v1/client/tokens"
  worker-enabled: false
  worker-id: ""
  worker-poll-ms: "500"
  worker-lease-ms: "60000"
  worker-retry-ms: "2000"
  worker-max-attempts: "3"
  worker-capture-timeout-ms: "120000"
  worker-batch: "8"
  redis-rate-limit-enabled: false
  redis-import-windows: true
  redis-gate-seconds: "900"
  compatibility-enabled: false
  public-origin: ${MIGRATION_PUBLIC_ORIGIN:http://127.0.0.1:8791}
  maintenance: ${MIGRATION_MAINTENANCE:true}
  allow-external-providers: ${MIGRATION_ALLOW_EXTERNAL_PROVIDERS:false}
  scenes-enabled: ${MIGRATION_SCENES_ENABLED:false}
  stripe-live-enabled: ${MIGRATION_STRIPE_LIVE_ENABLED:false}
