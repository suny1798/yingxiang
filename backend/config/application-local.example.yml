# 复制为 application-local.yml 后填写；此示例无真实凭据。
spring:
  datasource:
    driver-class-name: "org.postgresql.Driver"
    url: "jdbc:postgresql://db.example.invalid:5432/yingxiang"
    username: "yingxiang"
    password: "REPLACE_ME"
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 8000
      initialization-fail-timeout: -1
      read-only: true
      data-source-properties:
        sslmode: "disable"
        # 自签CA时填写本机证书绝对路径；未设置时使用驱动默认信任配置。
        # sslrootcert: "C:/certs/postgres-ca.crt"
  data:
    redis:
      host: "redis.example.invalid"
      port: 6379
      username: ""
      password: "REPLACE_ME"
      database: 0
      ssl:
        enabled: false
      connect-timeout: "5s"
      timeout: "6s"
migration:
  public-origin: "http://127.0.0.1:8791"
  db-schema: "yingxiang_migration"
  redis-namespace: "yingxiang:migration:test"
  maintenance: true
  allow-external-providers: false
  scenes-enabled: false
  stripe-live-enabled: false
