spring:
  application:
    name: yingxiang-migration
  profiles:
    default: local
  main:
    banner-mode: 'off'
  servlet:
    multipart:
      # 迁移入口按有界内存自行解析multipart，禁止Servlet容器预解析或落盘。
      enabled: false
  sql:
    init:
      mode: never
  flyway:
    enabled: false
server:
  address: 127.0.0.1
  port: ${MIGRATION_API_PORT:8792}
  servlet:
    context-path: /api
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    accesslog:
      enabled: false
logging:
  level:
    root: WARN
migration:
  studio-fixture-enabled: false
  auth-enabled: false
  account-read-enabled: false
  payments-enabled: false
  admin-enabled: false
  stripe-secret: ""
  stripe-webhook-secret: ""
  stripe-expected-account: ""
  stripe-api-base: "http://127.0.0.1:12111"
  video-enabled: false
  video-budget-usd: "0"
  video-max-jobs: "0"
  video-allowed-usernames: ""
  video-provider-url: "http://127.0.0.1:12112"
  video-key: ""
  works-enabled: false
  storage-root: "C:/yingxiang-migration-storage"
  public-origin: ${MIGRATION_PUBLIC_ORIGIN:http://127.0.0.1:8791}
  maintenance: ${MIGRATION_MAINTENANCE:true}
  allow-external-providers: ${MIGRATION_ALLOW_EXTERNAL_PROVIDERS:false}
  scenes-enabled: ${MIGRATION_SCENES_ENABLED:false}
  stripe-live-enabled: ${MIGRATION_STRIPE_LIVE_ENABLED:false}
